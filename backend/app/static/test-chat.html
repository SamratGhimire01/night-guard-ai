<!--
  DEV/TEST TOOL ONLY. Talks to the real widget endpoint
  (POST /api/v1/widget/{business_id}/messages) with no auth, mirroring what
  any anonymous website visitor can already do. Do not deploy this page
  anywhere public-facing in production.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Guard - Test Chat</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #16161d;
    --border: #2a2a35;
    --purple: #8b5cf6;
    --purple-dim: #6d28d9;
    --agent-bubble: #24242e;
    --text: #e8e6f0;
    --text-dim: #9a97ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--purple);
    box-shadow: 0 0 8px var(--purple);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .config {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .config input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
  }
  .config label {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .config label { flex: 1 1 200px; min-width: 0; }
  .config input { width: 100%; font-size: 16px; }
  .config .status { font-size: 11px; color: var(--text-dim); align-self: flex-end; padding-bottom: 6px; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 70%; display: flex; flex-direction: column; }
  @media (max-width: 480px) {
    .msg { max-width: 88%; }
  }
  .msg.customer { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.customer .bubble {
    background: var(--purple);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.agent .bubble {
    background: var(--agent-bubble);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.system .bubble {
    background: transparent;
    color: var(--text-dim);
    border: 1px dashed var(--border);
    font-size: 12px;
  }
  .intent {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 3px;
    padding: 0 4px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #content {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 16px;
  }
  #content:focus { outline: 1px solid var(--purple); }
  button#send {
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#send:hover { background: var(--purple-dim); }
  button#send:disabled { opacity: 0.5; cursor: not-allowed; }
  button#mic {
    background: var(--agent-bubble);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 44px;
    flex: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button#mic svg { width: 18px; height: 18px; }
  button#mic.ng-recording { background: #ef4444; border-color: #ef4444; color: #fff; animation: ng-pulse 1.2s infinite; }
  button#mic:disabled { opacity: 0.5; cursor: not-allowed; }
  @keyframes ng-pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }

  #typing {
    display: none;
    align-self: flex-start;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    padding: 10px 14px;
    width: fit-content;
  }
  #typing.ng-visible { display: block; }
  #typing span {
    display: inline-block;
    width: 6px; height: 6px;
    margin: 0 1px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: ng-typing 1.2s infinite;
  }
  #typing span:nth-child(2) { animation-delay: .15s; }
  #typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes ng-typing { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }
</style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>Night Guard - Test Chat</h1>
  </header>

  <div class="config">
    <label>Backend URL
      <input id="backendUrl">
    </label>
    <label>Business ID
      <input id="businessId" placeholder="00000000-0000-0000-0000-000000000000">
    </label>
    <div class="status" id="status"></div>
  </div>

  <div id="chat"></div>
  <div id="typing"><span></span><span></span><span></span></div>

  <form id="composer">
    <input id="content" placeholder="Type a message..." autocomplete="off">
    <button id="mic" type="button" title="Start voice message" aria-label="Start voice message">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke="currentColor" stroke-width="2"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="send" type="submit">Send</button>
  </form>

<script>
  let sessionToken = null;

  const chat = document.getElementById('chat');
  const form = document.getElementById('composer');
  const contentInput = document.getElementById('content');
  const sendBtn = document.getElementById('send');
  const micBtn = document.getElementById('mic');
  const typingEl = document.getElementById('typing');
  const backendUrlInput = document.getElementById('backendUrl');
  const businessIdInput = document.getElementById('businessId');
  const statusEl = document.getElementById('status');

  backendUrlInput.value = window.location.origin;
  businessIdInput.value = 'f0ca2a54-d76b-4c48-b727-1b0a0faea4cd'; // Samaj Dental Clinic

  function addMessage(role, text, intent) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    if (intent) {
      const intentEl = document.createElement('div');
      intentEl.className = 'intent';
      intentEl.textContent = 'intent: ' + intent;
      wrap.appendChild(intentEl);
    }
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  // ---- Phase 43h: real feedback shown immediately after ANY message is
  // sent (typed or voice), removed the moment the real response arrives --
  // same behavior widget.js already has for typed chat (Phase 38), added
  // here since this page never had it.
  function setTyping(visible) {
    typingEl.classList.toggle('ng-visible', visible);
    if (visible) chat.scrollTop = chat.scrollHeight;
  }

  function setSending(disabled) {
    contentInput.disabled = disabled;
    sendBtn.disabled = disabled;
    micBtn.disabled = disabled;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const content = contentInput.value.trim();
    const businessId = businessIdInput.value.trim();
    const backendUrl = backendUrlInput.value.trim().replace(/\/$/, '');
    if (!content) return;
    if (!businessId) {
      statusEl.textContent = 'Set a business_id first.';
      return;
    }

    addMessage('customer', content);
    contentInput.value = '';
    setSending(true);
    setTyping(true);
    statusEl.textContent = 'Sending...';

    try {
      const res = await fetch(`${backendUrl}/api/v1/widget/${businessId}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_token: sessionToken, content }),
      });

      if (!res.ok) {
        const errBody = await res.text();
        addMessage('system', `Error ${res.status}: ${errBody}`);
        statusEl.textContent = `Last request failed (${res.status})`;
        return;
      }

      const data = await res.json();
      sessionToken = data.session_token;
      addMessage('agent', data.response, data.intent);
      statusEl.textContent = 'session: ' + sessionToken.slice(0, 8) + '...';
    } catch (err) {
      addMessage('system', 'Network error: ' + err.message);
      statusEl.textContent = 'Network error';
    } finally {
      setTyping(false);
      setSending(false);
      contentInput.focus();
    }
  });

  // ---- Phase 43h: push-to-talk voice input, same backend path widget.js
  // uses (POST /api/v1/widget/{id}/voice-message) -- click the mic to
  // record ONE clip, click again to stop and upload it. No separate voice
  // logic: the transcript goes through the exact same orchestrator turn as
  // typed text, over the SAME sessionToken, and the reply renders as a
  // normal text bubble. No live call, no spoken audio output.

  let mediaRecorder = null;
  let mediaStream = null;
  let recordedChunks = [];
  let isRecording = false;

  function stopMediaStream() {
    if (mediaStream) {
      mediaStream.getTracks().forEach((track) => track.stop());
      mediaStream = null;
    }
  }

  async function sendVoiceRecording(blob) {
    const businessId = businessIdInput.value.trim();
    const backendUrl = backendUrlInput.value.trim().replace(/\/$/, '');
    setSending(true);
    setTyping(true);
    statusEl.textContent = 'Transcribing...';

    const formData = new FormData();
    formData.append('audio', blob, 'voice-message.webm');
    if (sessionToken) formData.append('session_token', sessionToken);

    try {
      const res = await fetch(`${backendUrl}/api/v1/widget/${businessId}/voice-message`, {
        method: 'POST',
        body: formData,
      });

      if (!res.ok) {
        const errBody = await res.text();
        addMessage('system', `Error ${res.status}: ${errBody}`);
        statusEl.textContent = `Last request failed (${res.status})`;
        return;
      }

      const data = await res.json();
      if (data.session_token) sessionToken = data.session_token;
      if (data.transcript) addMessage('customer', data.transcript);
      addMessage('agent', data.response, data.intent);
      statusEl.textContent = sessionToken ? 'session: ' + sessionToken.slice(0, 8) + '...' : '';
    } catch (err) {
      addMessage('system', 'Network error: ' + err.message);
      statusEl.textContent = 'Network error';
    } finally {
      setTyping(false);
      setSending(false);
    }
  }

  function startRecording() {
    if (isRecording) return;
    const businessId = businessIdInput.value.trim();
    if (!businessId) {
      statusEl.textContent = 'Set a business_id first.';
      return;
    }
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      addMessage('system', 'Voice messages are not supported in this browser.');
      return;
    }

    navigator.mediaDevices
      .getUserMedia({ audio: true })
      .then((stream) => {
        mediaStream = stream;
        recordedChunks = [];
        const options = { mimeType: 'audio/webm;codecs=opus' };
        try {
          mediaRecorder = window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(options.mimeType)
            ? new MediaRecorder(stream, options)
            : new MediaRecorder(stream);
        } catch (e) {
          mediaRecorder = new MediaRecorder(stream);
        }
        mediaRecorder.addEventListener('dataavailable', (event) => {
          if (event.data && event.data.size > 0) recordedChunks.push(event.data);
        });
        mediaRecorder.addEventListener('stop', () => {
          stopMediaStream();
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          recordedChunks = [];
          if (blob.size > 0) sendVoiceRecording(blob);
        });
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add('ng-recording');
        micBtn.setAttribute('aria-label', 'Stop recording');
      })
      .catch(() => {
        addMessage('system', 'Microphone access was denied, so voice messages are not available.');
      });
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    micBtn.classList.remove('ng-recording');
    micBtn.setAttribute('aria-label', 'Start voice message');
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    } else {
      stopMediaStream();
    }
  }

  micBtn.addEventListener('click', () => {
    if (isRecording) stopRecording();
    else startRecording();
  });
</script>
</body>
</html>
